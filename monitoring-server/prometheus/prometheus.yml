global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node_exporter
    static_configs:
      # private IPs of the target servers
      - targets: ["<target-server-1-ip>:9100"]
        labels: { host: target-server-1 }
      - targets: ["<target-server-2-ip>:9100"]
        labels: { host: target-server-2 }
