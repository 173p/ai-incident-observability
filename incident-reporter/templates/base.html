<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Incident Reporter{% endblock %}</title>
<style>
  body{font-family:"Segoe UI",system-ui,sans-serif;background:#0b0d12;color:#e6e8ee;margin:0;padding:40px 20px;font-size:14px;line-height:1.6}
  .wrap{max-width:900px;margin:0 auto}
  a{color:#6c7cff;text-decoration:none}
  a:hover{text-decoration:underline}
  h1{font-size:24px;margin:14px 0 4px}
  h2{font-size:15px;letter-spacing:.04em;text-transform:uppercase;margin:24px 0 14px}
  .card>h2:first-child{margin-top:0}
  .bolt{color:#f59e42}
  .sub{color:#8b90a0;margin:0 0 32px}
  .card{background:#151821;border:1px solid #232733;border-radius:12px;padding:28px;margin:0 0 20px}
  .box{background:#0d0f15;border-radius:8px;padding:14px 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .label{font-size:11px;color:#8b90a0;text-transform:uppercase;margin-bottom:4px}
  .badge{display:inline-block;background:#3a1a1f;color:#ff6b6b;font-size:11px;font-weight:600;padding:3px 12px;border-radius:999px;margin-bottom:16px}
  .analysis{padding:20px}
  .analysis p{margin:0}
  .analysis h3,.analysis h4,.analysis h5,.analysis h6{font-size:14px;margin:0}
  .analysis hr{border:0;border-top:1px solid #232733}
  .metric-name{font-size:12px;color:#8b90a0;margin-bottom:8px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
  .stats b{display:block;font-size:20px;font-weight:600;color:#e5636b}
  .stats span{font-size:10px;color:#6b7080}
  .logs{max-height:320px;overflow-y:auto;font-family:Consolas,monospace;font-size:12px;color:#aab0bf}
  .logs div{padding:5px 0;border-bottom:1px solid #1c1f29;word-break:break-all}
  code{font-family:Consolas,monospace}
  .crit{color:#ff6b6b}.warn{color:#f5c26b}
  table{width:100%;border-collapse:collapse}
  td,th{padding:10px 8px;border-bottom:1px solid #232733;text-align:left}
  th{font-size:11px;color:#8b90a0;text-transform:uppercase}
</style>
</head>
<body><div class="wrap">{% block content %}{% endblock %}</div></body>
</html>
