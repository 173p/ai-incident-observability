services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports: ["9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    entrypoint: ["/bin/sh", "-c"]
    # Render the config from the template so secrets come from .env, not git
    command:
      - >
        sed -e "s|\$${TELEGRAM_BOT_TOKEN}|$${TELEGRAM_BOT_TOKEN}|g"
        -e "s|\$${TELEGRAM_CHAT_ID}|$${TELEGRAM_CHAT_ID}|g"
        /etc/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml &&
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./alertmanager:/etc/alertmanager
    ports: ["9093:9093"]
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki:/etc/loki
      - loki-data:/loki
    ports: ["3100:3100"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    restart: unless-stopped

  incident-reporter:
    build: ../incident-reporter
    container_name: incident-reporter
    env_file: ../.env
    ports: ["5000:5000"]
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
